version: 2
models:
  - name: int_readings_resolved
    description: Readings mapped to a canonical beach_id, keeping DPNR's latest PDF per sampling date.
    columns:
      - name: reading_id
        tests: [unique, not_null]
      - name: beach_id
        tests: [not_null]
  - name: int_beach_sargassum_points
    description: NOAA SIR coastline points within the sargassum radius of each beach (same island only).
    tests:
      - unique_combination:
          arguments: {columns: [beach_id, point_id]}
