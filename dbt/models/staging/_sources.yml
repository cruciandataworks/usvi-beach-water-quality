version: 2
sources:
  - name: raw
    description: Untouched copies of what step 4 loaded from the PDFs and the DPNR media feed.
    tables:
      - name: beach_readings
        description: One row per beach row printed in a DPNR weekly Beach-Data PDF (all text).
      - name: pdf_manifest
        description: Every Beach-Data PDF listed in DPNR's WordPress media library.
      - name: pdf_downloads
      - name: extract_log
      - name: sargassum_points
        description: Every USVI coastline point in NOAA's Sargassum Inundation Risk (SIR) map, with its island.
      - name: sargassum_daily
        description: One row per SIR report day and coastline point, with NOAA's risk level 0-3 (all text).
      - name: sargassum_downloads
        description: Every SIR KMZ file the pipeline tried to fetch, with its checksum.
