# Runs the whole pipeline every Saturday morning (DPNR usually posts on Friday),
# then commits the refreshed dashboard data back to the repository.
name: Weekly beach data refresh

on:
  schedule:
    - cron: "0 13 * * 6"   # 13:00 UTC = 9:00 AM in St. Croix (AST, UTC-4)
  workflow_dispatch:        # adds a "Run workflow" button for manual runs
    inputs:
      test_failure:
        description: "Fail on purpose to test the failure alert"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write     # lets the failure alert open an issue

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}   # empty until the secret exists
    steps:
      - uses: actions/checkout@v5

      - name: Simulated failure (test runs only)
        if: ${{ inputs.test_failure }}
        run: |
          echo "::error::Test failure requested from the Run workflow button."
          exit 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cache downloaded PDFs between runs so only the new week's sheet is fetched
      - uses: actions/cache@v4
        with:
          path: data/raw/pdfs
          key: dpnr-pdfs-${{ github.run_id }}
          restore-keys: dpnr-pdfs-

      - name: Run pipeline (discover, download, extract, load, dbt build, export)
        run: python run_pipeline.py

      - name: Commit refreshed data
        run: |
          git config user.name "cdw-bot"
          git config user.email "hello@cruciandataworks.com"
          git add data/raw/manifest.csv data/raw/downloads.csv data/interim dashboard/data
          git diff --cached --quiet || git commit -m "Weekly DPNR beach data refresh"
          git push

      # Publish the refreshed dashboard to cruciandataworks.com (Hostinger) over FTP.
      # Skipped automatically until the three FTP secrets are added in
      # GitHub: Settings > Secrets and variables > Actions.
      - name: Upload dashboard to Hostinger
        if: ${{ env.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dashboard/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/projects/beach-water-quality/' }}

      # If any step above fails, open (or update) an issue assigned to the repository
      # admin. GitHub emails the assignee, so a broken week never goes unnoticed.
      - name: Alert on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ vars.ALERT_ASSIGNEE || 'OrlandoSpears' }}
        run: |
          gh label create refresh-failure --color C8553D --description "Weekly refresh failed" 2>/dev/null || true
          body="The weekly DPNR beach data refresh failed on $(date -u '+%Y-%m-%d %H:%M UTC').

          Run log: $RUN_URL

          The website still shows the last good data. Close this issue once the cause is fixed."
          open=$(gh issue list --label refresh-failure --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
            gh issue edit "$open" --add-assignee "$ASSIGNEE" || true
          else
            gh issue create --title "Weekly beach refresh failed" --label refresh-failure --assignee "$ASSIGNEE" --body "$body"
          fi

      # Once a run succeeds, the cause of any earlier failure is gone, so close the open
      # "refresh failed" issue with a link to the run that worked.
      - name: Close the failure issue after a successful run
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label refresh-failure --state open --json number -q '.[].number'); do
            gh issue close "$n" --reason completed \
              --comment "Closed automatically: the refresh succeeded on $(date -u '+%Y-%m-%d %H:%M UTC'). Run log: $RUN_URL"
          done
